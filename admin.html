<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>동원모터펌프 AS 접수 관리</title>

    <link rel="stylesheet" href="admin.css" />
  </head>

  <body>
    <main class="admin-container">
      <header class="admin-header">
        <div>
          <p class="company-name">동원모터펌프</p>
          <h1>AS 접수 관리</h1>
        </div>

        <button type="button" id="refreshButton">
          새로고침
        </button>
      </header>

      <section class="summary">
        <div>
          <strong id="requestCount">접수 0건</strong>
          <p id="summaryText">진행 중인 접수입니다.</p>
        </div>
      </section>

      <nav class="filter-tabs" aria-label="접수 상태 분류">
        <button
          type="button"
          class="filter-tab active"
          data-filter="active"
        >
          진행 중
        </button>

        <button
          type="button"
          class="filter-tab"
          data-filter="completed"
        >
          처리 완료
        </button>

        <button
          type="button"
          class="filter-tab"
          data-filter="all"
        >
          전체 기록
        </button>
      </nav>

      <p id="loadingMessage" class="state-message">
        접수 내용을 불러오는 중입니다.
      </p>

      <p id="errorMessage" class="state-message error hidden"></p>

      <p id="emptyMessage" class="state-message hidden">
        해당하는 접수 내역이 없습니다.
      </p>

      <section id="requestList" class="request-list"></section>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
