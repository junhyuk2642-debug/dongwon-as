<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>동원모터펌프 AS 접수 관리</title>

    <link rel="stylesheet" href="admin.css" />
  </head>

  <body>
    <main class="admin-container">
      <!-- 상단 제목 -->
      <header class="admin-header">
        <div>
          <p class="company-name">
            동원모터펌프
          </p>

          <h1>
            AS 접수 관리
          </h1>
        </div>

        <button
          type="button"
          id="refreshButton"
        >
          새로고침
        </button>
      </header>

      <!-- 접수 검색 -->
      <section class="search-section">
        <label
          for="requestSearch"
          class="search-label"
        >
          접수 검색
        </label>

        <div class="search-box">
          <input
            type="search"
            id="requestSearch"
            placeholder="현장명, 담당자, 연락처, 주소, 고장 내용을 검색하세요"
            autocomplete="off"
          />

          <button
            type="button"
            id="clearSearchButton"
            class="clear-search-button hidden"
            aria-label="검색어 지우기"
            title="검색어 지우기"
          >
            ×
          </button>
        </div>

        <p
          id="searchResultText"
          class="search-result-text hidden"
        ></p>
      </section>

      <!-- 접수 요약 -->
      <section class="summary">
        <div>
          <strong id="requestCount">
            접수 0건
          </strong>

          <p id="summaryText">
            진행 중인 접수입니다.
          </p>
        </div>
      </section>

      <!-- 상태별 필터 -->
      <nav
        class="filter-tabs"
        aria-label="접수 상태 분류"
      >
        <button
          type="button"
          class="filter-tab active"
          data-filter="active"
        >
          진행 중
        </button>

        <button
          type="button"
          class="filter-tab"
          data-filter="completed"
        >
          처리 완료
        </button>

        <button
          type="button"
          class="filter-tab"
          data-filter="all"
        >
          전체 기록
        </button>
      </nav>

      <!-- 불러오는 중 -->
      <p
        id="loadingMessage"
        class="state-message"
      >
        접수 내용을 불러오는 중입니다.
      </p>

      <!-- 오류 메시지 -->
      <p
        id="errorMessage"
        class="state-message error hidden"
      ></p>

      <!-- 접수 없음 -->
      <p
        id="emptyMessage"
        class="state-message hidden"
      >
        해당하는 접수 내역이 없습니다.
      </p>

      <!-- 접수 카드 목록 -->
      <section
        id="requestList"
        class="request-list"
      ></section>
    </main>

    <!-- 사진 확대 모달 -->
    <div
      id="imageModal"
      class="image-modal hidden"
      role="dialog"
      aria-modal="true"
      aria-label="사진 확대 보기"
    >
      <button
        type="button"
        id="closeImageModal"
        class="image-modal-close"
        aria-label="사진 닫기"
      >
        ×
      </button>

      <img
        id="modalImage"
        class="image-modal-content"
        src=""
        alt="확대된 접수 사진"
      />
    </div>

    <script src="admin.js"></script>
  </body>
</html>
